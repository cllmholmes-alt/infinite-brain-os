<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Map - Operator Portfolio Topology</title>
<style>
  :root {
    --bone: #f5f4ed;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-faint: #8a8a8a;
    --hairline: #d8d6cd;
    --ember: #c4582b;
    --ember-soft: #e8a878;
    --green: #4a7c59;
    --blue: #3b6ea5;
    --purple: #7b6ea0;
    --gold: #c4a04a;
    --teal: #4a9c9c;
    --rose: #b86b8a;
    --slate: #5a6a7a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--bone);
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
    z-index: 100;
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  .topbar .stats {
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    gap: 12px;
  }
  .topbar .stats span { white-space: nowrap; }
  .topbar .filter-bar {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 4px 10px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: transparent;
    font-size: 11px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--ink-faint); }
  .filter-btn.active {
    background: var(--ink);
    color: var(--bone);
    border-color: var(--ink);
  }

  /* Canvas */
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: grab;
  }
  #canvas.dragging { cursor: grabbing; }
  #canvas svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .edge {
    stroke: var(--ink-faint);
    stroke-width: 1;
    fill: none;
    opacity: 0.3;
    transition: opacity 0.2s, stroke 0.2s;
  }
  .edge.highlighted {
    opacity: 0.8;
    stroke: var(--ember);
    stroke-width: 2;
  }
  .edge-arrow { fill: var(--ink-faint); opacity: 0.3; }

  /* Nodes */
  .node {
    position: absolute;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    transition: box-shadow 0.15s, transform 0.1s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 10;
  }
  .node:hover {
    transform: translateY(-1px);
    z-index: 50;
  }
  .node .node-icon {
    font-size: 14px;
    line-height: 1;
  }
  .node .node-label {
    font-size: 12px;
  }
  .node .node-meta {
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-left: 4px;
  }

  /* Cluster containers */
  .cluster-bg {
    position: absolute;
    border-radius: 14px;
    border: 2px dashed;
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
  }
  .cluster-label {
    position: absolute;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-faint);
    pointer-events: none;
    z-index: 2;
  }

  /* Status indicators */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-green { background: var(--green); box-shadow: 0 0 6px rgba(74,124,89,0.4); }
  .status-amber { background: var(--gold); }
  .status-red { background: var(--ember); }
  .status-gray { background: var(--ink-faint); }

  /* Detail panel */
  #detail-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 320px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    background: rgba(245,244,237,0.97);
    backdrop-filter: blur(8px);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    display: none;
    z-index: 200;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  #detail-panel.visible { display: block; }
  #detail-panel h3 {
    font-size: 15px;
    margin-bottom: 4px;
  }
  #detail-panel .detail-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }
  #detail-panel .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 12px;
  }
  #detail-panel .detail-row:last-child { border-bottom: none; }
  #detail-panel .detail-label { color: var(--ink-faint); }
  #detail-panel .detail-value { font-weight: 500; text-align: right; }
  #detail-panel .close-btn {
    position: absolute;
    top: 10px; right: 12px;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink-faint);
    line-height: 1;
  }
  #detail-panel .close-btn:hover { color: var(--ink); }

  /* Zoom controls */
  .zoom-controls {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
  }
  .zoom-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: rgba(245,244,237,0.9);
    cursor: pointer;
    font-size: 16px;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn:hover { border-color: var(--ink-faint); }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 16px;
    right: 16px;
    background: rgba(245,244,237,0.9);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 11px;
    z-index: 100;
  }
  .legend-title {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-faint);
    margin-bottom: 6px;
    font-size: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }
</style>
</head>

// ============================================================
// RENDERING
// ============================================================
const canvas = document.getElementById('canvas');
const edgeLayer = document.getElementById('edge-layer');
let zoom = 1;
let panX = 0, panY = 0;
let isDragging = false;
let dragStart = null;
let activeFilter = 'all';

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

function renderClusters() {
  Object.entries(clusters).forEach(([key, c]) => {
    if (activeFilter !== 'all' && activeFilter !== key) return;

    const bg = document.createElement('div');
    bg.className = 'cluster-bg';
    bg.style.left = (c.x * zoom + panX) + 'px';
    bg.style.top = (c.y * zoom + panY) + 'px';
    bg.style.width = (c.w * zoom) + 'px';
    bg.style.height = (c.h * zoom) + 'px';
    bg.style.borderColor = c.color;
    canvas.appendChild(bg);

    const lbl = document.createElement('div');
    lbl.className = 'cluster-label';
    lbl.textContent = c.label;
    lbl.style.left = (c.x * zoom + panX + 12) + 'px';
    lbl.style.top = (c.y * zoom + panY + 8) + 'px';
    lbl.style.color = c.color;
    canvas.appendChild(lbl);
  });
}

function renderNodes() {
  nodes.forEach(n => {
    if (activeFilter !== 'all' && activeFilter !== n.cluster) return;

    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = n.id;
    el.style.left = (n.x * zoom + panX) + 'px';
    el.style.top = (n.y * zoom + panY) + 'px';
    el.style.background = clusters[n.cluster].color + '15';
    el.style.border = '1px solid ' + clusters[n.cluster].color + '40';

    el.innerHTML = `
      <span class="node-icon">${n.icon}</span>
      <span class="node-label">${n.label}</span>
    `;

    el.onclick = (e) => { e.stopPropagation(); showDetail(n.id); };
    el.onmouseenter = () => highlightEdges(n.id);
    el.onmouseleave = () => clearHighlights();
    canvas.appendChild(el);
  });
}

function renderEdges() {
  edgeLayer.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  edgeLayer.setAttribute('width', canvas.clientWidth);
  edgeLayer.setAttribute('height', canvas.clientHeight);

  // Add arrow marker definition
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = `
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="edge-arrow" />
    </marker>
  `;
  edgeLayer.appendChild(defs);

  edges.forEach(e => {
    const fromNode = nodeMap[e.from];
    const toNode = nodeMap[e.to];
    if (!fromNode || !toNode) return;
    if (activeFilter !== 'all') {
      if (fromNode.cluster !== activeFilter && toNode.cluster !== activeFilter) return;
    }

    const x1 = fromNode.x * zoom + panX + 70;
    const y1 = fromNode.y * zoom + panY + 18;
    const x2 = toNode.x * zoom + panX + 70;
    const y2 = toNode.y * zoom + panY + 18;

    const path = document.createElementNS(ns, 'path');
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const curve = Math.min(dist * 0.15, 40);

    // Bezier curve
    const cx = midX + (dy / dist) * curve;
    const cy = midY - (dx / dist) * curve;

    path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
    path.classList.add('edge');
    path.dataset.from = e.from;
    path.dataset.to = e.to;

    if (e.type === 'dashed') path.setAttribute('stroke-dasharray', '4 3');
    if (e.type === 'dotted') path.setAttribute('stroke-dasharray', '1 3');

    edgeLayer.appendChild(path);
  });
}

function highlightEdges(nodeId) {
  document.querySelectorAll('.edge').forEach(p => {
    if (p.dataset.from === nodeId || p.dataset.to === nodeId) {
      p.classList.add('highlighted');
    }
  });
}

function clearHighlights() {
  document.querySelectorAll('.edge').forEach(p => p.classList.remove('highlighted'));
}

function showDetail(nodeId) {
  const n = nodeMap[nodeId];
  if (!n) return;
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-name').textContent = n.label;
  document.getElementById('detail-type').textContent = clusters[n.cluster].label;

  let html = '';
  const d = n.details || {};
  for (const [k, v] of Object.entries(d)) {
    html += `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`;
  }
  // Add connections
  const out = edges.filter(e => e.from === nodeId).map(e => `${e.label} -> ${nodeMap[e.to].label}`);
  const inc = edges.filter(e => e.to === nodeId).map(e => `${nodeMap[e.from].label} -> ${e.label}`);
  if (out.length || inc.length) {
    html += '<div style="margin-top: 10px; font-size: 11px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase;">Connections</div>';
    [...out, ...inc].forEach(c => {
      html += `<div style="font-size: 11px; padding: 2px 0; color: var(--ink-soft);">${c}</div>`;
    });
  }
  document.getElementById('detail-body').innerHTML = html;
  panel.classList.add('visible');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
}

function clearCanvas() {
  canvas.querySelectorAll('.node, .cluster-bg, .cluster-label').forEach(el => el.remove());
}

function render() {
  clearCanvas();
  renderClusters();
  renderNodes();
  renderEdges();
}

function filterCluster(cluster, btn) {
  activeFilter = cluster;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function adjustZoom(delta) {
  zoom = Math.max(0.4, Math.min(2.5, zoom * delta));
  render();
}

function resetView() {
  zoom = 1;
  panX = 0;
  panY = 0;
  render();
}

// Pan support
canvas.addEventListener('mousedown', (e) => {
  if (e.target === canvas || e.target === edgeLayer) {
    isDragging = true;
    dragStart = { x: e.clientX - panX, y: e.clientY - panY };
    canvas.classList.add('dragging');
  }
});

document.addEventListener('mousemove', (e) => {
  if (isDragging) {
    panX = e.clientX - dragStart.x;
    panY = e.clientY - dragStart.y;
    render();
  }
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

// Click canvas to close detail
canvas.addEventListener('click', (e) => {
  if (e.target === canvas || e.target === edgeLayer) closeDetail();
});

// Initial render
render();
</script>
</body>
</html>
